name: Build release packages

# Public-mirror automation. This file is synced from the private repo by
# scripts/sync-public.js (allowlisted as .github/) and runs ONLY on the
# public mirror (Amppa/fb-feed-diet). It builds the Chrome + Firefox zips
# with the zero-dependency packager and attaches them to a GitHub Release,
# so no local `npm run package` + manual upload is needed.
#
# Trigger: every sync-public push to public master that touches release
# inputs, tests, or the workflow itself (manifest version bump counts),
# plus manual workflow_dispatch.

on:
  push:
    branches: [master]
    paths:
      - 'manifest.json'
      - 'package.json'
      - 'icons/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

      - name: Build Chrome + Firefox packages
        run: npm run package

      - name: Read version from manifest.json
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with zips
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*.zip
