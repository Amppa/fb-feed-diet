<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Diet</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="card">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-badge">FD</div>
        <div>
          <h1 class="title">FB Diet</h1>
          <p class="subtitle">Feed Declutter & Diet</p>
        </div>
      </div>
      <label class="switch main-toggle" title="Master Toggle">
        <input type="checkbox" id="enabled">
        <span class="slider round"></span>
      </label>
    </header>

    <!-- Stat Counter -->
    <div class="stat-card">
      <div class="stat-info">
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-title">Items Folded on Diet</span>
      </div>
    </div>

    <!-- Settings Button -->
    <button class="settings-btn" id="settingsBtn">⚙️ Options</button>
  </div>

  <script src="popup.js"></script>
</body>

</html>
